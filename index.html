:root{
  --bg:#f5f6f8; --card:#ffffff; --line:#e3e6eb; --text:#1d2330; --sub:#6b7383;
  --primary:#3b5bfd; --primary-soft:#eef1ff;
  --sun:#e5484d; --sat:#2f6fe4; --holi-bg:#fff4f4; --wkd-bg:#fafbfc; --today:#3b5bfd;
  --ev:#3b5bfd; --ev-bg:#eef1ff;
  --ps:#d9480f; --ps-bg:#fff1e6;
  --vac:#2b8a3e; --vac-bg:#ebfbee;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 16px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Paperlogy',-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;font-weight:300}
button,input,select,textarea{font-family:inherit;font-size:inherit;font-weight:inherit;color:inherit}
b,strong,h1,h2{font-weight:400}
.wrap{max-width:1400px;margin:0 auto;padding:20px 16px 40px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;margin-bottom:14px}
.title{display:flex;align-items:center;gap:10px}
.title h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.3px}
.nav{display:flex;align-items:center;gap:6px}
.nav .ym{font-size:20px;font-weight:800;min-width:130px;text-align:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:400;transition:.15s}
.btn:hover{border-color:#c7ccd6}
.btn.icon{width:36px;height:36px;padding:0;display:grid;place-items:center;font-size:16px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--sun);border-color:#f3c4c5}
.actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;box-shadow:var(--shadow)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;user-select:none;font-weight:400;background:#fff}
.fchip .dot{width:8px;height:8px;border-radius:50%}
.fchip.off{opacity:.4}
.stats{display:flex;gap:14px;color:var(--sub);font-size:13px;flex-wrap:wrap}
.stats b{color:var(--text)}
.search{border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:180px}

/* calendar */
.layout{display:grid;grid-template-columns:1fr 320px;gap:12px;align-items:start}
.cal{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow div{padding:9px 8px;font-weight:400;font-size:13px;text-align:center;border-bottom:1px solid var(--line);background:#fbfbfd}
.dow div:first-child{color:var(--sun)} .dow div:last-child{color:var(--sat)}
.cell{min-height:118px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 6px 8px;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:3px;transition:background .12s}
.cell:nth-child(7n){border-right:none}
.cell:hover{background:#f8f9ff}
.cell.wkd{background:var(--wkd-bg)}
.cell.holi{background:var(--holi-bg)}
.cell.other{opacity:.38}
.cell.sel{outline:2px solid var(--primary);outline-offset:-2px;z-index:1}
.dhead{display:flex;align-items:center;gap:5px;min-height:22px}
.dnum{font-weight:400;font-size:13px;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;flex:none}
.cell.sun .dnum,.cell.holi .dnum{color:var(--sun)}
.cell.sat:not(.holi) .dnum{color:var(--sat)}
.cell.today .dnum{background:var(--today);color:#fff!important}
.hname{font-size:11px;color:var(--sun);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addbtn{margin-left:auto;opacity:0;border:none;background:var(--primary-soft);color:var(--primary);width:20px;height:20px;border-radius:5px;cursor:pointer;font-weight:400;line-height:1;flex:none}
.cell:hover .addbtn{opacity:1}
.chip{font-size:12px;border-radius:5px;padding:2px 6px;line-height:1.45;border-left:3px solid;cursor:pointer;word-break:break-all}
.chip:hover{filter:brightness(.97)}
.chip.event{background:var(--ev-bg);border-color:var(--ev)}
.chip.ps{background:var(--ps-bg);border-color:var(--ps)}
.chip.vac{background:var(--vac-bg);border-color:var(--vac)}
.chip .t{font-weight:400;margin-right:3px}
.chip .tag{font-size:10px;font-weight:400;padding:0 4px;border-radius:3px;margin-right:4px;color:#fff;vertical-align:1px}
.chip.ps .tag{background:var(--ps)} .chip.vac .tag{background:var(--vac)}
.chip .pl{color:var(--sub)}
.count-badge{display:none}

/* side panel */
.side{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);position:sticky;top:12px;max-height:calc(100vh - 24px);display:flex;flex-direction:column}
.side-h{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.side-h .d{font-size:17px;font-weight:400}
.side-h .h{color:var(--sun);font-size:13px;font-weight:400;margin-top:2px}
.side-b{padding:10px 12px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.item{border:1px solid var(--line);border-left:4px solid;border-radius:8px;padding:9px 10px;cursor:pointer;background:#fff}
.item:hover{background:#fafbff}
.item.event{border-left-color:var(--ev)} .item.ps{border-left-color:var(--ps)} .item.vac{border-left-color:var(--vac)}
.item .r1{display:flex;align-items:center;gap:6px;font-weight:400}
.item .r2{color:var(--sub);font-size:12.5px;margin-top:3px;display:flex;flex-direction:column;gap:2px}
.badge{font-size:11px;font-weight:400;padding:1px 6px;border-radius:4px}
.badge.event{background:var(--ev-bg);color:var(--ev)} .badge.ps{background:var(--ps-bg);color:var(--ps)} .badge.vac{background:var(--vac-bg);color:var(--vac)}
.empty{color:var(--sub);text-align:center;padding:24px 0;font-size:13px}

/* modal */
.mask{position:fixed;inset:0;background:rgba(15,20,30,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.mask.show{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:460px;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-h{padding:16px 18px 8px;display:flex;justify-content:space-between;align-items:center}
.modal-h h2{margin:0;font-size:18px}
.x{border:none;background:none;font-size:22px;cursor:pointer;color:var(--sub)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px 18px 6px}
.tab{border:1px solid var(--line);border-radius:8px;padding:9px 0;font-weight:400;cursor:pointer;background:#fff;text-align:center}
.tab.on.event{background:var(--ev);border-color:var(--ev);color:#fff}
.tab.on.ps{background:var(--ps);border-color:var(--ps);color:#fff}
.tab.on.vac{background:var(--vac);border-color:var(--vac);color:#fff}
.form{padding:8px 18px 4px;display:flex;flex-direction:column;gap:11px}
.f label{display:block;font-size:12.5px;font-weight:400;color:var(--sub);margin-bottom:5px}
.f label .req{color:var(--sun)}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff;outline:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.check{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:400;color:var(--text);cursor:pointer}
.check input{width:auto}
.hint{font-size:12px;color:var(--sub)}
.modal-f{display:flex;gap:8px;justify-content:space-between;padding:14px 18px 18px}
.modal-f .right{display:flex;gap:8px;margin-left:auto}
.hide{display:none!important}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px}
.sdot{width:7px;height:7px;border-radius:50%;background:#adb5bd}
.sync.ok .sdot{background:#2b8a3e}.sync.err .sdot{background:var(--sun)}.sync.busy .sdot{background:#f59f00}
.mask .btn[disabled]{opacity:.6;cursor:wait}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1d2330;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
.toast.show{opacity:1}

/* ===== 10/30 굿바이 칸 ===== */
.cell.bye{background:linear-gradient(165deg,#fff3e4 0%,#ffdcd0 50%,#f1d2f5 100%);overflow:hidden}
.cell.bye:hover{background:linear-gradient(165deg,#ffeedb 0%,#ffd4c6 50%,#ecc8f2 100%)}
.bye-foot{margin-top:auto;text-align:right;line-height:1.1;padding-top:4px}
.bye-foot b{display:block;font-weight:800;font-size:17px;letter-spacing:.3px;background:linear-gradient(90deg,#e8590c,#c2255c);-webkit-background-clip:text;background-clip:text;color:transparent}
.bye-foot small{font-size:10.5px;color:#a5466b}
.cell.bye > *:not(.bye-art){position:relative;z-index:1}
.cell.bye .chip{box-shadow:0 1px 3px rgba(120,60,40,.12)}
.cell.bye .chip.event{background:rgba(238,241,255,.92)}
.cell.bye .chip.ps{background:rgba(255,241,230,.92)}
.cell.bye .chip.vac{background:rgba(235,251,238,.92)}
.cell.bye:not(.today) .dnum{color:#c2410c}
.bye-tag{font-size:10.5px;font-weight:400;color:#fff;background:linear-gradient(90deg,#f97316,#e8590c 50%,#c2255c);padding:1px 7px;border-radius:999px;white-space:nowrap;letter-spacing:.2px}
.bye-art{position:absolute;inset:0;pointer-events:none;z-index:0}
.bye-art svg{width:100%;height:100%;display:block}
.bye-art .plane{animation:byeFly 3.6s ease-in-out infinite}
@keyframes byeFly{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(3px,-3px) rotate(-3deg)}}
@media (prefers-reduced-motion:reduce){.bye-art .plane{animation:none}}
@media (max-width:640px){.bye-tag,.bye-foot{display:none}}
@media print{.bye-art .plane{animation:none}}

/* responsive */
@media (max-width:1000px){
  .layout{grid-template-columns:1fr}
  .side{position:static;max-height:none}
}
@media (max-width:640px){
  .wrap{padding:14px 10px 30px}
  .title h1{font-size:18px}
  .nav .ym{font-size:17px;min-width:110px}
  .cell{min-height:64px;padding:4px 3px}
  .cell .chip,.hname,.addbtn{display:none}
  .count-badge{display:flex;gap:3px;flex-wrap:wrap;margin-top:2px}
  .count-badge span{width:7px;height:7px;border-radius:50%}
  .search{min-width:0;width:100%}
}
@media print{
  body{background:#fff}
  .actions,.toolbar,.side,.addbtn,.nav .btn{display:none!important}
  .layout{grid-template-columns:1fr}
  .cal{box-shadow:none}
  .cell{min-height:90px}
}
</style>

<body>
<div class="wrap">
  <div class="top">
    <div class="title"><h1>월간 타임테이블</h1><span class="sync" id="sync"><span class="sdot"></span><span id="syncText">연결 중…</span></span></div>
    <div class="nav">
      <button class="btn icon" id="prev" title="이전 달">‹</button>
      <div class="ym" id="ym"></div>

<script>
/* ===== 공휴일 데이터 =====

   그 외 연도: 양력 고정 공휴일만 자동 표기 (음력 명절·대체공휴일은 아래 HOLIDAYS에 추가) */
const HOLIDAYS = {

  "2026-05-24":"부처님오신날","2026-05-25":"대체공휴일(부처님오신날)","2026-06-03":"전국동시지방선거",
  "2026-06-06":"현충일","2026-07-17":"제헌절","2026-08-15":"광복절","2026-08-17":"대체공휴일(광복절)",
  "2026-09-24":"추석 연휴","2026-09-25":"추석","2026-09-26":"추석 연휴","2026-10-03":"개천절",
  "2026-10-05":"대체공휴일(개천절)","2026-10-09":"한글날","2026-12-25":"성탄절",
  "2027-01-01":"신정","2027-02-06":"설날 연휴","2027-02-07":"설날","2027-02-08":"설날 연휴",
  "2027-02-09":"대체공휴일(설날)","2027-03-01":"삼일절","2027-05-01":"노동절","2027-05-03":"대체공휴일(노동절)",
  "2027-05-05":"어린이날","2027-05-13":"부처님오신날","2027-06-06":"현충일","2027-07-17":"제헌절",
  "2027-07-19":"대체공휴일(제헌절)","2027-08-15":"광복절","2027-08-16":"대체공휴일(광복절)",
  "2027-09-14":"추석 연휴","2027-09-15":"추석","2027-09-16":"추석 연휴","2027-10-03":"개천절",
  "2027-10-04":"대체공휴일(개천절)","2027-10-09":"한글날","2027-10-11":"대체공휴일(한글날)",
  "2027-12-25":"성탄절","2027-12-27":"대체공휴일(성탄절)"
};
const FIXED = {"01-01":"신정","03-01":"삼일절","05-01":"노동절","05-05":"어린이날","06-06":"현충일","07-17":"제헌절","08-15":"광복절","10-03":"개천절","10-09":"한글날","12-25":"성탄절"};
const KNOWN_YEARS = new Set([2026,2027]);
function holidayOf(ds){
  if(HOLIDAYS[ds]) return HOLIDAYS[ds];
  const y=+ds.slice(0,4);
  if(!KNOWN_YEARS.has(y) && y>=2026) return FIXED[ds.slice(5)]||"";
  return "";
}

/* ===== 공유 저장소 (Supabase) ===== */
const SB_URL="https://cfbqeisxhuntbocqpkbi.supabase.co";
const SB_KEY="sb_publishable_aOqPe1EMJosrU_fNEsnaxw_Hx9OxrpT";
const TABLE="schedules";
const CACHE_KEY="monthly-timetable-cache";
const OLD_KEY="monthly-timetable-v1";
const sb=window.supabase?window.supabase.createClient(SB_URL,SB_KEY):null;
let items=[];
function setSync(state,text){const el=document.getElementById("sync");el.className="sync "+state;document.getElementById("syncText").textContent=text}
const toRow=it=>({id:it.id,type:it.type,date:it.date,end_date:it.endDate||null,title:it.title||"",person:it.person||"",place:it.place||"",memo:it.memo||"",vac_kind:it.vacKind||"",all_day:!!it.allDay,start_time:it.start||"",end_time:it.end||"",updated_at:new Date().toISOString()});
const fromRow=r=>({id:r.id,type:r.type,date:r.date,endDate:r.end_date||"",title:r.title||"",person:r.person||"",place:r.place||"",memo:r.memo||"",vacKind:r.vac_kind||"",allDay:!!r.all_day,start:r.start_time||"",end:r.end_time||""});
function cache(){try{localStorage.setItem(CACHE_KEY,JSON.stringify(items))}catch(e){}}
async function load(){
  if(!sb){setSync("err","오프라인 · 저장 불가");try{items=JSON.parse(localStorage.getItem(CACHE_KEY)||"[]")}catch(e){};return}
  setSync("busy","불러오는 중…");
  try{
    let all=[],from=0;
    for(;;){
      const {data,error}=await sb.from(TABLE).select("*").order("date").range(from,from+999);
      if(error) throw error;
      all=all.concat(data); if(data.length<1000) break; from+=1000;
    }
    items=all.map(fromRow); cache(); setSync("ok","실시간 공유 중");
  }catch(e){
    console.error(e);
    try{items=JSON.parse(localStorage.getItem(CACHE_KEY)||"[]")}catch(_){}
    setSync("err","연결 실패 · 저장 불가"); toast("공유 서버에 연결하지 못했어요. 잠시 후 새로고침해주세요.");
  }
}
async function upsertItems(list){const {error}=await sb.from(TABLE).upsert(list.map(toRow));if(error) throw error}
async function removeItem(id){const {error}=await sb.from(TABLE).delete().eq("id",id);if(error) throw error}
let reloadT=null;
function subscribe(){
  if(!sb) return;
  sb.channel("schedules-live").on("postgres_changes",{event:"*",schema:"public",table:TABLE},()=>{
    clearTimeout(reloadT); reloadT=setTimeout(async()=>{await load();render()},300);
  }).subscribe(st=>{if(st==="SUBSCRIBED")setSync("ok","실시간 공유 중")});
}
/* 이전 버전(내 브라우저에만 저장)의 데이터를 공유 캘린더로 옮기기 */
async function migrateOld(){
  let old=[];try{old=JSON.parse(localStorage.getItem(OLD_KEY)||"[]")}catch(e){}
  if(!old.length||!sb) return;
  const ids=new Set(items.map(i=>i.id)); const fresh=old.filter(i=>i&&i.id&&!ids.has(i.id));
  if(fresh.length){
    if(!confirm(`이 브라우저에만 저장돼 있던 ${fresh.length}건이 있습니다.\n공유 캘린더로 올려서 모두가 볼 수 있게 할까요?`)) return;
    try{await upsertItems(fresh);await load();render();toast(`${fresh.length}건을 공유 캘린더로 옮겼습니다.`)}catch(e){toast("옮기기에 실패했어요. 새로고침 후 다시 시도해주세요.");return}
  }
  try{localStorage.removeItem(OLD_KEY)}catch(e){}
}

/* ===== 유틸 ===== */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,"0");
const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const DOW=["일","월","화","수","목","금","토"];
const LABEL={event:"일정",ps:"PS",vac:"휴가"};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2000)}

/* ===== 상태 ===== */
const now=new Date();
let cur=new Date(now.getFullYear(),now.getMonth(),1);
let selected=fmt(now);
let filters={event:true,ps:true,vac:true};
let query="";

function covers(it,ds){const e=it.endDate||it.date;return it.date<=ds && ds<=e}
function visible(it){
  if(!filters[it.type]) return false;
  if(!query) return true;
  const q=query.toLowerCase();
  return [it.title,it.person,it.place,it.memo,it.vacKind].some(v=>(v||"").toLowerCase().includes(q));
}
const ORDER={vac:0,ps:1,event:2};
function sortItems(a,b){
  if(ORDER[a.type]!==ORDER[b.type]) return ORDER[a.type]-ORDER[b.type];
  const ta=a.allDay?"00:00":(a.start||"99:99"), tb=b.allDay?"00:00":(b.start||"99:99");
  return ta.localeCompare(tb);
}
function itemsOn(ds){return items.filter(it=>covers(it,ds)&&visible(it)).sort(sortItems)}
function timeText(it){
  if(it.type==="vac") return "";
  if(it.allDay) return "종일";
  if(it.start&&it.end) return `${it.start}~${it.end}`;
  return it.start||"";
}

/* ===== 특별한 날: 10/30 굿바이 ===== */
const BYE_DATE="2026-10-30";
const BYE_ART=`<div class="bye-art" aria-hidden="true"><svg viewBox="0 0 200 130" preserveAspectRatio="xMaxYMax slice" xmlns="http://www.w3.org/2000/svg">
<defs>
<radialGradient id="byeSun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffb366"/><stop offset=".7" stop-color="#ff8a5c" stop-opacity=".85"/><stop offset="1" stop-color="#ff7a7a" stop-opacity="0"/></radialGradient>
<linearGradient id="byeHill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4a3a8" stop-opacity=".55"/><stop offset="1" stop-color="#d98bc8" stop-opacity=".55"/></linearGradient>
</defs>
<circle cx="158" cy="118" r="44" fill="url(#byeSun)" opacity=".75"/>
<circle cx="158" cy="118" r="22" fill="#ffc38a" opacity=".9"/>

<path d="M166 34 L194 16 L180 40 L176 32 Z" fill="#fff" stroke="#e8590c" stroke-width="1.3" stroke-linejoin="round"/>
<path d="M176 32 L194 16 L172 30" fill="#ffd8c2" stroke="#e8590c" stroke-width="1.1" stroke-linejoin="round"/>
</g>
<g fill="#f06595" opacity=".6"><path d="M130 52 c-2-3-6-1-4 2 l4 4 4-4 c2-3-2-5-4-2z"/><path d="M96 40 c-1.5-2-4.5-.8-3 1.5 l3 3 3-3 c1.5-2.3-1.5-3.5-3-1.5z"/></g>
<g fill="#f59f00" opacity=".7"><path d="M146 70 l1.2 3 3 1.2-3 1.2-1.2 3-1.2-3-3-1.2 3-1.2z"/><path d="M60 50 l1 2.4 2.4 1-2.4 1-1 2.4-1-2.4-2.4-1 2.4-1z"/></g>
</svg></div>`;

/* ===== 렌더 ===== */
function render(){
  const y=cur.getFullYear(), m=cur.getMonth();
  $("#ym").textContent=`${y}년 ${m+1}월`;
  const first=new Date(y,m,1);
  const start=new Date(y,m,1-first.getDay());
  const lastDay=new Date(y,m+1,0).getDate();
  const weeks=Math.ceil((first.getDay()+lastDay)/7);
  const today=fmt(new Date());
  let html="";
  for(let i=0;i<weeks*7;i++){
    const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
    const ds=fmt(d), dow=d.getDay(), hol=holidayOf(ds);
    const cls=["cell"];
    if(d.getMonth()!==m) cls.push("other");
    if(dow===0) cls.push("sun","wkd");
    if(dow===6) cls.push("sat","wkd");
    if(hol) cls.push("holi");
    if(ds===today) cls.push("today");
    if(ds===selected) cls.push("sel");
    const isBye=ds===BYE_DATE; if(isBye) cls.push("bye");
    const list=itemsOn(ds);
    const chips=list.map(it=>{
      if(it.type==="vac") return `<div class="chip vac" data-id="${it.id}"><span class="tag">휴가</span>${esc(it.person)} ${esc(it.vacKind)}</div>`;
      const t=timeText(it), pl=it.place?` <span class="pl">@${esc(it.place)}</span>`:"";
      const tag=it.type==="ps"?`<span class="tag">PS</span>`:"";
      const name=it.type==="ps"?`${esc(it.person)}${it.title?" · "+esc(it.title):""}`:esc(it.title);
      return `<div class="chip ${it.type}" data-id="${it.id}">${tag}${t?`<span class="t">${t}</span>`:""}${name}${pl}</div>`;
    }).join("");
    const dots=list.slice(0,6).map(it=>`<span style="background:var(--${it.type==="event"?"ev":it.type})"></span>`).join("");
    html+=`<div class="${cls.join(" ")}" data-date="${ds}">
      ${isBye?BYE_ART:""}<div class="dhead"><span class="dnum">${d.getDate()}</span>${isBye?`<span class="bye-tag">👋 Bye</span>`:""}${hol?`<span class="hname" title="${esc(hol)}">${esc(hol)}</span>`:""}<button class="addbtn" data-add="${ds}" title="이 날짜에 등록">+</button></div>
      ${chips}${isBye?`<div class="bye-foot"><b>Goodbye</b><small>그동안 고마웠어요 :)</small></div>`:""}<div class="count-badge">${dots}</div></div>`;
  }
  $("#grid").innerHTML=html;
  renderStats(y,m);
  renderSide();
  document.querySelectorAll(".fchip").forEach(c=>c.classList.toggle("off",!filters[c.dataset.f]));
}
function renderStats(y,m){
  const ms=`${y}-${pad(m+1)}`, mStart=`${ms}-01`, mEnd=`${ms}-${pad(new Date(y,m+1,0).getDate())}`;
  const inMonth=items.filter(it=>it.date<=mEnd && (it.endDate||it.date)>=mStart);
  const c=t=>inMonth.filter(i=>i.type===t).length;
  // 휴가 일수(이번 달 범위 내, 반차 0.5 / 반반차 0.25, 주말·공휴일 제외)
  let vacDays=0;
  inMonth.filter(i=>i.type==="vac").forEach(it=>{
    const w=it.vacKind.includes("반반")?0.25:it.vacKind.includes("반차")?0.5:1;
    let d=new Date(it.date+"T00:00:00"), e=new Date((it.endDate||it.date)+"T00:00:00");
    for(;d<=e;d.setDate(d.getDate()+1)){
      const ds=fmt(d); if(ds<mStart||ds>mEnd) continue;
      if(d.getDay()===0||d.getDay()===6||holidayOf(ds)) continue;
      vacDays+=w;
    }
  });
  let workdays=0;
  for(let i=1;i<=new Date(y,m+1,0).getDate();i++){const d=new Date(y,m,i);if(d.getDay()%6!==0&&!holidayOf(fmt(d)))workdays++}
  $("#stats").innerHTML=`<span>영업일 <b>${workdays}</b>일</span><span>일정 <b>${c("event")}</b>건</span><span>PS <b>${c("ps")}</b>건</span><span>휴가 <b>${c("vac")}</b>건 (<b>${vacDays}</b>일)</span>`;
}
function renderSide(){
  const d=new Date(selected+"T00:00:00");
  $("#sideDate").textContent=`${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`;
  $("#sideDate").style.color=(d.getDay()===0||holidayOf(selected))?"var(--sun)":d.getDay()===6?"var(--sat)":"";
  $("#sideHoli").textContent=holidayOf(selected);
  const list=itemsOn(selected);
  $("#sideList").innerHTML=list.length?list.map(it=>{
    const head=it.type==="vac"?`${esc(it.person)} · ${esc(it.vacKind)}`:it.type==="ps"?`${esc(it.person)}${it.title?" · "+esc(it.title):""}`:esc(it.title);
    const lines=[];
    if(it.type==="vac") lines.push(`기간 ${it.date}${it.endDate&&it.endDate!==it.date?" ~ "+it.endDate:""}`);
    const t=timeText(it); if(t) lines.push(`시간 ${t}`);
    if(it.place) lines.push(`장소 ${esc(it.place)}`);
    if(it.memo) lines.push(esc(it.memo));
    return `<div class="item ${it.type}" data-id="${it.id}"><div class="r1"><span class="badge ${it.type}">${LABEL[it.type]}</span>${head}</div>${lines.length?`<div class="r2">${lines.map(l=>`<span>${l}</span>`).join("")}</div>`:""}</div>`;
  }).join(""):`<div class="empty">등록된 일정이 없습니다.<br>＋ 등록 버튼으로 추가하세요.</div>`;
}

/* ===== 모달 ===== */
let mType="event", editId=null;
function setType(t){
  mType=t;
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.dataset.t===t));
  document.querySelectorAll(".form [class*='t-']").forEach(el=>{
    const types=[...el.classList].filter(c=>c.startsWith("t-")).map(c=>c.slice(2));
    el.classList.toggle("hide",!types.includes(t));
  });
  $("#lTitle").innerHTML=t==="ps"?"내용":"일정명 <span class=\"req\">*</span>";
  $("#fTitle").placeholder=t==="ps"?"예) PS 진행 / 대상 업무":"예) 주간 회의";
  $("#lDate").innerHTML=(t==="vac"?"시작일":"날짜")+" <span class=\"req\">*</span>";
  $("#fHint").textContent=t==="vac"?"여러 날 휴가는 종료일을 지정하세요. 주말·공휴일은 휴가 일수 집계에서 자동 제외됩니다.":"";
  syncAllDay();
}
function syncAllDay(){$("#timeRow").style.opacity=$("#fAllDay").checked?.4:1;["#fStart","#fEndTime"].forEach(s=>$(s).disabled=$("#fAllDay").checked)}
function openModal(date,it){
  editId=it?it.id:null;
  $("#mTitle").textContent=it?"수정":"등록";
  $("#mSave").textContent=it?"저장":"등록";
  $("#mDelete").classList.toggle("hide",!it);
  $("#fPerson").value=it?.person||"";
  $("#fTitle").value=it?.title||"";
  $("#fVacKind").value=it?.vacKind||"연차";
  $("#fDate").value=it?.date||date||selected;
  $("#fEnd").value=it?.endDate||"";
  $("#fAllDay").checked=!!it?.allDay;
  $("#fStart").value=it?.start||"";
  $("#fEndTime").value=it?.end||"";
  $("#fPlace").value=it?.place||"";
  $("#fMemo").value=it?.memo||"";
  setType(it?.type||"event");
  $("#mask").classList.add("show");
  setTimeout(()=>(mType==="event"?$("#fTitle"):$("#fPerson")).focus(),50);
}
function closeModal(){$("#mask").classList.remove("show")}
async function saveModal(){
  const v=s=>$(s).value.trim();
  const it={id:editId||uid(),type:mType,date:v("#fDate"),memo:v("#fMemo")};
  if(!it.date) return toast("날짜를 입력해주세요.");
  if(mType==="vac"){
    it.person=v("#fPerson"); it.vacKind=v("#fVacKind");
    it.endDate=v("#fEnd")||it.date;
    if(!it.person) return toast("이름을 입력해주세요.");
    if(it.endDate<it.date) return toast("종료일이 시작일보다 빠릅니다.");
  }else{
    it.title=v("#fTitle"); it.place=v("#fPlace");
    it.allDay=$("#fAllDay").checked;
    it.start=it.allDay?"":v("#fStart"); it.end=it.allDay?"":v("#fEndTime");
    if(mType==="ps"){it.person=v("#fPerson"); if(!it.person) return toast("이름을 입력해주세요.");}
    else if(!it.title) return toast("일정명을 입력해주세요.");
    if(it.start&&it.end&&it.end<it.start) return toast("종료 시간이 시작 시간보다 빠릅니다.");
  }
  if(!sb) return toast("공유 서버에 연결되지 않아 저장할 수 없어요.");
  const btn=$("#mSave"); if(btn.disabled) return; btn.disabled=true; setSync("busy","저장 중…");
  try{await upsertItems([it])}catch(e){console.error(e);btn.disabled=false;setSync("err","저장 실패");return toast("저장에 실패했어요. 네트워크를 확인해주세요.")}
  btn.disabled=false; setSync("ok","실시간 공유 중");
  const idx=items.findIndex(x=>x.id===it.id);
  if(idx>=0) items[idx]=it; else items.push(it);
  cache(); closeModal();
  selected=it.date;
  const d=new Date(it.date+"T00:00:00"); cur=new Date(d.getFullYear(),d.getMonth(),1);
  render(); toast(editId?"수정되었습니다.":`${LABEL[it.type]}이(가) 등록되었습니다.`);
}
async function deleteItem(){
  if(!editId||!confirm("삭제하시겠습니까?\n공유 캘린더에서 모든 사람에게 삭제됩니다.")) return;
  try{await removeItem(editId)}catch(e){console.error(e);return toast("삭제에 실패했어요.")}
  items=items.filter(x=>x.id!==editId); cache(); closeModal(); render(); toast("삭제되었습니다.");
}

/* ===== 이벤트 ===== */
$("#prev").onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);render()};
$("#next").onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);render()};
$("#todayBtn").onclick=()=>{const n=new Date();cur=new Date(n.getFullYear(),n.getMonth(),1);selected=fmt(n);render()};
$("#addBtn").onclick=()=>openModal(selected);
$("#sideAdd").onclick=()=>openModal(selected);
$("#grid").addEventListener("click",e=>{
  const add=e.target.closest("[data-add]");
  if(add){e.stopPropagation();selected=add.dataset.add;render();return openModal(selected)}
  const chip=e.target.closest(".chip");
  if(chip){const it=items.find(x=>x.id===chip.dataset.id);return it&&openModal(null,it)}
  const cell=e.target.closest(".cell"); if(!cell) return;
  selected=cell.dataset.date;
  if(cell.classList.contains("other")){const d=new Date(selected+"T00:00:00");cur=new Date(d.getFullYear(),d.getMonth(),1)}
  render();
  if(window.innerWidth<=1000) $(".side").scrollIntoView({behavior:"smooth",block:"start"});
});
$("#grid").addEventListener("dblclick",e=>{const cell=e.target.closest(".cell");if(cell&&!e.target.closest(".chip"))openModal(cell.dataset.date)});
$("#sideList").addEventListener("click",e=>{const el=e.target.closest(".item");if(el){const it=items.find(x=>x.id===el.dataset.id);it&&openModal(null,it)}});
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>setType(t.dataset.t));
document.querySelectorAll(".fchip").forEach(c=>c.onclick=()=>{filters[c.dataset.f]=!filters[c.dataset.f];render()});
$("#search").oninput=e=>{query=e.target.value.trim();render()};
$("#fAllDay").onchange=syncAllDay;
$("#fDate").onchange=()=>{if(mType==="vac"&&(!$("#fEnd").value||$("#fEnd").value<$("#fDate").value))$("#fEnd").value=$("#fDate").value};
$("#mClose").onclick=closeModal; $("#mCancel").onclick=closeModal;
$("#mSave").onclick=saveModal; $("#mDelete").onclick=deleteItem;
$("#mask").addEventListener("mousedown",e=>{if(e.target.id==="mask")closeModal()});
document.addEventListener("keydown",e=>{
  if(!$("#mask").classList.contains("show")) return;
  if(e.key==="Escape") closeModal();
  if(e.key==="Enter"&&e.target.tagName!=="TEXTAREA"){e.preventDefault();saveModal()}
});

/* 백업/불러오기 */
$("#exportBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),items},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`timetable-backup-${fmt(new Date())}.json`;a.click();URL.revokeObjectURL(a.href);
};
$("#importBtn").onclick=()=>$("#importFile").click();
$("#importFile").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const data=JSON.parse(r.result); const arr=Array.isArray(data)?data:data.items;
      if(!Array.isArray(arr)) throw 0;
      const ids=new Set(items.map(i=>i.id)); const fresh=arr.filter(i=>i&&i.id&&!ids.has(i.id));
      if(!fresh.length) toast("새로 추가할 항목이 없습니다.");
      else if(confirm(`${fresh.length}건을 공유 캘린더에 추가합니다. (기존 항목은 유지)`)){
        await upsertItems(fresh); await load(); render(); toast("불러오기 완료");
      }
    }catch(err){console.error(err);toast("불러오기에 실패했어요. 백업 파일을 확인해주세요.")}
    e.target.value="";
  };
  r.readAsText(f);
};

render();
load().then(()=>{render();subscribe();migrateOld()});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load().then(render)});
</script>
</body>
</html>
